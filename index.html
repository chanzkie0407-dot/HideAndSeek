<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Wild Bounty Showdown — ×1024 Max</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Georgia', serif; }
  :root {
    --woodDark: #5C3A1E;
    --woodMed: #8B5A2B;
    --woodLight: #D49647;
    --gold: #FFD700;
    --goldDim: #C89600;
    --goldBright: #FFEC00;
    --bgWestern: linear-gradient(180deg, #2B1708 0%, #1A0F05 100%);
    --reelBg: linear-gradient(180deg, #4A2E1A 0%, #301E10 100%);
    --symbolBg: #241408;
    --btnGold: linear-gradient(180deg, #FFD700 0%, #C89600 100%);
    --btnBrown: linear-gradient(180deg, #8B5A2B 0%, #5C3A1E 100%);
  }
  body {
    background: var(--bgWestern);
    min-height: 100vh;
    color: #F5DEB3;
    padding: 15px;
    text-align: center;
  }
  .container { max-width: 560px; margin: 0 auto; }

  /* === TOP MULTIPLIER BANNER === */
  .mult-banner {
    background: linear-gradient(180deg, #A06020 0%, #704010 100%);
    border: 3px solid var(--goldDim);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 12px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .mult-steps {
    display: flex; justify-content: center; gap: 5px; flex-wrap: wrap;
  }
  .mult-step {
    background: rgba(0,0,0,0.4);
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    border: 2px solid transparent;
    transition: all 0.3s;
  }
  .mult-step.active {
    background: linear-gradient(180deg, #FFD700 0%, #E6B000 100%);
    color: #2B1708;
    border-color: #FFF8DC;
    box-shadow: 0 0 12px gold;
    transform: scale(1.1);
  }
  .mult-step.maxed {
    background: linear-gradient(180deg, #FFEC00 0%, #FFB300 100%);
    box-shadow: 0 0 20px gold, 0 0 30px rgba(255,215,0,0.5);
    animation: pulseMax 0.8s infinite alternate;
  }
  @keyframes pulseMax {
    from { transform: scale(1.05); }
    to { transform: scale(1.15); }
  }
  .mult-note { font-size: 12px; opacity: 0.7; margin-top: 8px; }

  /* === REEL FRAME === */
  .slot-frame {
    background: linear-gradient(180deg, #905020 0%, #603010 100%);
    border: 4px solid var(--goldDim);
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 0 25px rgba(255,200,0,0.2), inset 0 0 20px rgba(0,0,0,0.6);
    margin-bottom: 12px;
  }
  .ways-label {
    font-size: 13px; opacity: 0.7; margin-bottom: 8px;
  }
  .reels-container {
    display: flex; gap: 6px; background: var(--reelBg);
    padding: 8px; border-radius: 10px;
  }
  .reel {
    flex: 1; height: 145px; background: var(--symbolBg);
    border-radius: 6px; overflow: hidden; position: relative;
    border: 2px solid #6B4020;
  }
  .reel-inner {
    position: absolute; width: 100%;
    transition: transform cubic-bezier(0.18, 0.65, 0.85, 0.98);
  }
  .symbol {
    height: 48px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; border-bottom: 1px solid #402818;
    transition: all 0.2s;
    position: relative;
  }
  .symbol.scatter { color: #FFD700; background: rgba(255,215,0,0.15); }
  .symbol.wild { color: #FFD700; background: rgba(255,215,0,0.1); }
  .symbol.win-highlight {
    background: rgba(255,215,0,0.25);
    box-shadow: inset 0 0 15px rgba(255,215,0,0.4);
  }

  /* === BOTTOM INFO BAR === */
  .info-bar {
    display: flex; justify-content: space-between;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .info-col { text-align: center; }
  .info-label { opacity: 0.6; font-size: 11px; }
  .info-val { font-weight: bold; font-size: 16px; }
  .win-bar {
    background: rgba(255,215,0,0.15);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 20px; font-weight: bold; color: var(--gold);
    min-height: 45px;
    text-shadow: 0 0 8px rgba(255,215,0,0.5);
  }
  .win-bar.mega {
    font-size: 24px;
    background: rgba(255,215,0,0.25);
    box-shadow: 0 0 15px rgba(255,215,0,0.3);
  }
  .fs-status {
    background: rgba(50,205,50,0.15);
    border-radius: 8px; padding: 8px; margin-bottom: 12px;
    color: #90EE90; font-weight: bold; display: none;
  }

  /* === CONTROLS === */
  .controls { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
    color: #2B1708;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-spin { background: var(--btnGold); font-size: 20px; }
  .btn-fs { background: linear-gradient(180deg, #32CD32 0%, #228B22 100%); color: white; display: none; }
  .btn-min, .btn-plus { flex: 0 0 50px; padding: 14px; background: var(--btnBrown); color: white; }
</style>
</head>
<body>
<div class="container">

  <!-- MULTIPLIER BANNER — UP TO ×1024 -->
  <div class="mult-banner">
    <div class="mult-steps" id="multSteps">
      <div class="mult-step active" data-level="0">×1</div>
      <div class="mult-step" data-level="1">×2</div>
      <div class="mult-step" data-level="2">×4</div>
      <div class="mult-step" data-level="3">×8</div>
      <div class="mult-step" data-level="4">×16</div>
      <div class="mult-step" data-level="5">×32</div>
      <div class="mult-step" data-level="6">×64</div>
      <div class="mult-step" data-level="7">×128</div>
      <div class="mult-step" data-level="8">×256</div>
      <div class="mult-step" data-level="9">×512</div>
      <div class="mult-step" data-level="10">×1024</div>
    </div>
    <div class="mult-note">🔥 Multiplier DOUBLES after every win — Max ×1024! Resets on non-win</div>
  </div>

  <!-- SLOT FRAME -->
  <div class="slot-frame">
    <div class="ways-label">3600 Ways to Win</div>
    <div class="reels-container" id="reelsContainer"></div>
  </div>

  <!-- FREE SPINS STATUS -->
  <div class="fs-status" id="fsStatus">
    🎁 FREE SPINS ACTIVE — Remaining: <span id="fsRemain">0</span>
  </div>

  <!-- WIN BAR -->
  <div class="win-bar" id="winBar"></div>

  <!-- INFO BAR -->
  <div class="info-bar">
    <div class="info-col">
      <div class="info-label">BALANCE</div>
      <div class="info-val" id="balance">1000.00</div>
    </div>
    <div class="info-col">
      <div class="info-label">BET</div>
      <div class="info-val" id="betVal">1.20</div>
    </div>
    <div class="info-col">
      <div class="info-label">FREE SPINS</div>
      <div class="info-val" id="fsCount">0</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-min" onclick="changeBet(-0.20)">−</button>
    <button class="btn btn-spin" id="spinBtn" onclick="spin()">🎰 SPIN</button>
    <button class="btn btn-plus" onclick="changeBet(+0.20)">+</button>
    <button class="btn btn-fs" id="fsBtn" onclick="useFreeSpin()">🎁 FS</button>
  </div>

</div>

<script>
// ==============================================
// 🔊 SOUNDS
// ==============================================
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type='sine', vol=0.3) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.frequency.value = freq; o.type = type;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, AC.currentTime+dur);
  o.start(AC.currentTime); o.stop(AC.currentTime+dur);
}
function spinSound() { tone(200,.1,'tri',.2); setTimeout(()=>tone(300,.08),80); setTimeout(()=>tone(400,.08),160); }
function winSound() { [523,659,784,1047].map((f,i)=>setTimeout(()=>tone(f,.3,'sine',.3),i*110)); }
function bigWinSound() { [392,494,587,784,988,1175,1319].map((f,i)=>setTimeout(()=>tone(f,.35,'sine',.4),i*80)); }
function megaWinSound() { [262,330,392,523,659,784,1047,1319,1568].map((f,i)=>setTimeout(()=>tone(f,.4,'sine',.5),i*70)); }
function scatterSound() { [523,659,784,1047,1319].map((f,i)=>setTimeout(()=>tone(f,.3,'sine',.4),i*100)); }

// ==============================================
// 🎰 GAME DATA & STATE
// ==============================================
const SYMBOLS = [
  { id: 'A', disp: 'A', payout: 25 },
  { id: 'K', disp: 'K', payout: 20 },
  { id: 'Q', disp: 'Q', payout: 15 },
  { id: 'J', disp: 'J', payout: 12 },
  { id: '10', disp: '10', payout: 10 },
  { id: '9', disp: '9', payout: 8 },
  { id: 'bottle', disp: '🍾', payout: 30 },
  { id: 'hat', disp: '🤠', payout: 35 },
  { id: 'gun', disp: '🔫', payout: 40 },
  { id: 'badge', disp: '⭐', payout: 50 },
  { id: 'WILD', disp: '💎', payout: 0, isWild: true },
  { id: 'SCATTER', disp: '🏜️', payout: 0, isScatter: true }
];

const game = {
  balance: 1000.00,
  bet: 1.20,
  freeSpins: 0,
  streak: 0, // consecutive wins
  isSpinning: false,
  reelCount: 5,
  rows: 3,
  MAX_STREAK: 10, // → ×1024

  // ✨ MULTIPLIER: ×2^streak — MAX ×1024
  get multiplier() { return Math.pow(2, Math.min(this.streak, this.MAX_STREAK)); },

  init() {
    this.load();
    this.buildReels();
    this.updateUI();
  },

  buildReels() {
    const c = document.getElementById('reelsContainer');
    c.innerHTML = '';
    for (let r=0; r<this.reelCount; r++) {
      const reel = document.createElement('div');
      reel.className = 'reel'; reel.id = `reel-${r}`;
      const inner = document.createElement('div');
      inner.className = 'reel-inner'; inner.id = `inner-${r}`;
      for (let i=0; i<this.rows+6; i++) {
        const s = document.createElement('div');
        s.className = 'symbol'; s.id = `s-${r}-${i}`;
        inner.appendChild(s);
      }
      reel.appendChild(inner); c.appendChild(reel);
    }
  },

  randSym() { return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]; },

  spinReels() {
    if (this.isSpinning) return;
    const usingFS = this.freeSpins > 0;
    if (!usingFS) {
      if (this.balance < this.bet) { alert('Insufficient balance!'); return; }
      this.balance -= this.bet;
    } else {
      this.freeSpins--;
    }
    this.isSpinning = true;
    spinSound();
    document.getElementById('winBar').textContent = '';
    document.getElementById('winBar').classList.remove('mega');

    const result = [];
    for (let r=0; r<this.reelCount; r++) {
      result[r] = [];
      const stopRow = Math.floor(Math.random()*4)+2;
      for (let i=0; i<this.rows; i++) {
        const sym = this.randSym();
        result[r].push(sym);
        const el = document.getElementById(`s-${r}-${i}`);
        el.textContent = sym.disp;
        el.className = 'symbol'
          + (sym.isScatter ? ' scatter' : '')
          + (sym.isWild ? ' wild' : '');
      }
      const inner = document.getElementById(`inner-${r}`);
      inner.style.transition = `transform ${1.1+r*0.25}s cubic-bezier(0.18,0.65,0.85,0.98) ${r*0.28}s`;
      inner.style.transform = `translateY(-${stopRow*48}px)`;
    }

    setTimeout(()=>{
      this.isSpinning = false;
      this.evaluate(result, usingFS);
    }, 2000);
  },

  evaluate(reels, isFS) {
    // Count Scatters
    let scatterCount = 0;
    for (let r=0; r<this.reelCount; r++) {
      for (let i=0; i<this.rows; i++) {
        if (reels[r][i].isScatter) scatterCount++;
      }
    }

    // 🎁 SCATTER → FREE SPINS
    if (scatterCount >= 3) {
      let fsAward = 0;
      if (scatterCount === 3) fsAward = 10;
      else if (scatterCount === 4) fsAward = 12;
      else if (scatterCount === 5) fsAward = 15;
      scatterSound();
      this.freeSpins += fsAward;
      setTimeout(()=>alert(`🏜️ ${scatterCount} SCATTER = ${fsAward} FREE SPINS!`), 400);
    }

    // Check wins — left to right, Wild substitutes
    let totalWin = 0;

    // Check all 3 rows as separate win lines
    for (let row=0; row<this.rows; row++) {
      let matchLen = 0;
      let refSym = null;
      for (let r=0; r<this.reelCount; r++) {
        const sym = reels[r][row];
        if (sym.isWild) {
          matchLen++;
          continue;
        }
        if (!refSym) {
          refSym = sym;
          matchLen++;
        } else if (sym.id === refSym.id) {
          matchLen++;
        } else {
          break;
        }
      }
      if (matchLen >= 3 && refSym) {
        const payout = refSym.payout * this.bet / 10 * matchLen;
        totalWin += payout;
        for (let r=0; r<matchLen; r++) {
          document.getElementById(`s-${r}-${row}`).classList.add('win-highlight');
        }
      }
    }

    if (totalWin > 0) {
      // ✅ WIN → Streak continues, multiplier DOUBLES
      if (this.streak < this.MAX_STREAK) this.streak++;
      const mult = this.multiplier;
      const finalWin = totalWin * mult;
      this.balance += finalWin;

      // Sound based on multiplier level
      if (mult >= 128) megaWinSound();
      else if (mult >= 16) bigWinSound();
      else winSound();

      // Display
      const winBar = document.getElementById('winBar');
      if (mult >= 128) winBar.classList.add('mega');
      winBar.innerHTML = `🎉 WIN: ${finalWin.toFixed(2)} ${mult>1 ? ' @ ×'+mult : ''}`
        + (mult >= 1024 ? '<br>🔥🔥 MAX MULTIPLIER REACHED! 🔥🔥' : '');
    } else {
      // ❌ NO WIN → Reset to ×1
      this.streak = 0;
    }

    this.updateMultiplierUI();
    this.updateUI();
  },

  updateMultiplierUI() {
    const steps = document.querySelectorAll('.mult-step');
    steps.forEach((el, i) => {
      el.classList.remove('active', 'maxed');
      if (i < this.streak + 1) {
        el.classList.add('active');
        if (i === this.MAX_STREAK) el.classList.add('maxed');
      }
    });
  },

  updateUI() {
    document.getElementById('balance').textContent = this.balance.toFixed(2);
    document.getElementById('betVal').textContent = this.bet.toFixed(2);
    document.getElementById('fsCount').textContent = this.freeSpins;
    document.getElementById('fsRemain').textContent = this.freeSpins;
    document.getElementById('fsStatus').style.display = this.freeSpins>0 ? 'block' : 'none';
    document.getElementById('fsBtn').style.display = this.freeSpins>0 ? 'inline-block' : 'none';
    document.getElementById('spinBtn').disabled = this.isSpinning;
    this.save();
  },

  save() {
    localStorage.setItem('wb_bal', this.balance);
    localStorage.setItem('wb_bet', this.bet);
    localStorage.setItem('wb_fs', this.freeSpins);
    localStorage.setItem('wb_streak', this.streak);
  },
  load() {
    this.balance = parseFloat(localStorage.getItem('wb_bal')) || 1000.00;
    this.bet = parseFloat(localStorage.getItem('wb_bet')) || 1.20;
    this.freeSpins = parseInt(localStorage.getItem('wb_fs')) || 0;
    this.streak = parseInt(localStorage.getItem('wb_streak')) || 0;
    this.updateMultiplierUI();
  }
};

// ==============================================
// 🎯 CONTROLS
// ==============================================
async function spin() {
  if (game.isSpinning) return;
  resetHighlights();
  // Reset reel position
  for (let r=0; r<game.reelCount; r++) {
    const inner = document.getElementById(`inner-${r}`);
    inner.style.transition = 'none';
    inner.style.transform = 'translateY(0)';
  }
  await new Promise(r=>setTimeout(r,50));
  game.spinReels();
}

async function useFreeSpin() {
  if (game.freeSpins <=0 || game.isSpinning) return;
  await spin();
}

function changeBet(amt) {
  if (game.isSpinning) return;
  const newBet = Math.max(0.20, Math.min(10.00, game.bet + amt));
  game.bet = newBet;
  game.updateUI();
}

function resetHighlights() {
  for (let r=0; r<game.reelCount; r++) {
    for (let i=0; i<game.rows; i++) {
      const el = document.getElementById(`s-${r}-${i}`);
      if (el) el.classList.remove('win-highlight');
    }
  }
}

// START
game.init();
</script>
</body>
</html>
