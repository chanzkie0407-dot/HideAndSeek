<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Wild Bounty Showdown — Fixed Rolling</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Arial', sans-serif; }
  :root {
    --bgMain: #2B1708;
    --reelBg: #1F1208;
    --gold: #FFD700;
    --goldDim: #B8860B;
    --btnGold: linear-gradient(180deg, #FFD700 0%, #E6B000 100%);
    --btnBrown: linear-gradient(180deg, #8B5A2B 0%, #5C3A1E 100%);
    --textLight: #F5DEB3;
    --borderGold: 3px solid #B8860B;
    --goldFrameBorder: 3px solid #FFD700;
  }
  body {
    background: var(--bgMain);
    min-height: 100vh;
    color: var(--textLight);
    padding: 15px;
    text-align: center;
  }
  .container { max-width: 680px; margin: 0 auto; }

  /* === MULTIPLIER BANNER === */
  .mult-banner {
    background: linear-gradient(180deg, #B8860B 0%, #8B6508 100%);
    border: var(--borderGold);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 15px;
    display: flex; justify-content: center; gap: 5px; flex-wrap: wrap;
  }
  .mult-label { font-weight: bold; margin-right: 8px; color: #FFF; }
  .mult-step {
    background: rgba(0,0,0,0.4);
    padding: 5px 8px; border-radius: 4px;
    font-weight: bold; font-size: 13px; min-width: 38px;
    border: 2px solid transparent;
  }
  .mult-step.active {
    background: var(--gold); color: #2B1708; border-color: #FFF8DC;
    box-shadow: 0 0 10px gold;
  }
  .mult-step.maxed {
    box-shadow: 0 0 15px gold, 0 0 25px rgba(255,215,0,0.5);
    animation: pulseMax 0.8s infinite alternate;
  }
  @keyframes pulseMax {
    from { transform: scale(1.05); }
    to { transform: scale(1.1); }
  }

  /* === REELS — TUMPAK SA 3-4-5-5-4-3 === */
  .reels-frame {
    background: linear-gradient(180deg, #905020 0%, #603010 100%);
    border: 5px solid var(--goldDim);
    border-radius: 14px;
    padding: 15px; margin-bottom: 15px;
    box-shadow: 0 0 25px rgba(255,200,0,0.2);
  }
  .reels-container {
    display: flex; gap: 5px; background: var(--reelBg);
    padding: 8px; border-radius: 8px; overflow: hidden;
  }
  .reel {
    flex: 1; border-radius: 4px; overflow: hidden;
    border: 2px solid #6B4020; background: #241408;
    position: relative;
  }
  .reel.r1 { height: 150px; }
  .reel.r2 { height: 200px; }
  .reel.r3 { height: 250px; }
  .reel.r4 { height: 250px; }
  .reel.r5 { height: 200px; }
  .reel.r6 { height: 150px; }

  /* === TUNAY NA PAGBAGSAK MULA ITAAS === */
  .reel-viewport {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    overflow: hidden;
  }
  .reel-strip {
    position: absolute; width: 100%; top: 0; left: 0;
    transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.45, 1);
  }
  .reel-strip.spinning {
    transition: transform 1.2s cubic-bezier(0.17, 0.67, 0.45, 1);
  }
  .reel-strip.cascading {
    transition: transform 0.6s ease-in;
  }
  .symbol {
    height: 50px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: bold; position: relative;
    border-bottom: 1px solid #402818;
  }
  .symbol:last-child { border-bottom: none; }
  .symbol.gold-frame {
    border: var(--goldFrameBorder);
    box-shadow: inset 0 0 10px rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.1);
  }
  .symbol.scatter { color: var(--gold); background: rgba(255,215,0,0.15); }
  .symbol.wild { color: #FFD700; background: rgba(255,215,0,0.1); }
  .symbol.win-highlight {
    background: rgba(255,215,0,0.25);
    box-shadow: inset 0 0 12px rgba(255,215,0,0.4);
  }
  .symbol.falling {
    animation: fallIn 0.5s ease-out;
  }
  @keyframes fallIn {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .removing {
    animation: explode 0.4s forwards;
  }
  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.5; background: rgba(255,215,0,0.3); }
    100% { transform: scale(0); opacity: 0; }
  }

  /* === OTHERS === */
  .cascade-indicator { font-size: 13px; opacity: 0.8; margin-bottom: 8px; height: 20px; }
  .bet-panel { background: rgba(0,0,0,0.6); border-radius: 10px; padding: 15px; margin-bottom: 15px; display: none; }
  .bet-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
  .bet-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
  .bet-val { font-weight: bold; color: var(--gold); }
  .bet-controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .btn-brown { background: var(--btnBrown); color: white; }
  .btn-yellow { background: var(--btnGold); color: #2B1708; }
  .btn-green { background: linear-gradient(180deg, #32CD32 0%, #228B22 100%); color: white; }
  .toggle-bet { background: var(--btnBrown); color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; margin-bottom: 15px; }
  .status-bar { display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 12px 15px; margin-bottom: 15px; }
  .status-col { text-align: center; }
  .status-label { opacity: 0.6; font-size: 12px; margin-bottom: 2px; }
  .status-val { font-weight: bold; font-size: 18px; }
  .fs-indicator { background: rgba(50,205,50,0.15); border-radius: 8px; padding: 10px; margin-bottom: 15px; color: #90EE90; font-weight: bold; display: none; }
  .win-bar { background: rgba(255,215,0,0.15); border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 18px; font-weight: bold; color: var(--gold); min-height: 50px; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
  .win-bar.mega { font-size: 22px; background: rgba(255,215,0,0.25); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
  .spin-btn { width: 100%; padding: 18px; border: none; border-radius: 10px; background: var(--btnGold); color: #2B1708; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .spin-btn.fs-mode { background: linear-gradient(180deg, #32CD32 0%, #228B22 100%); color: white; }
</style>
</head>
<body>
<div class="container">

  <div class="mult-banner">
    <span class="mult-label">3600 WAYS</span>
    <div class="mult-step" data-m="1">×1</div>
    <div class="mult-step" data-m="2">×2</div>
    <div class="mult-step" data-m="4">×4</div>
    <div class="mult-step" data-m="8">×8</div>
    <div class="mult-step" data-m="16">×16</div>
    <div class="mult-step" data-m="32">×32</div>
    <div class="mult-step" data-m="64">×64</div>
    <div class="mult-step" data-m="128">×128</div>
    <div class="mult-step" data-m="256">×256</div>
    <div class="mult-step" data-m="512">×512</div>
    <div class="mult-step" data-m="1024">×1024</div>
  </div>

  <div class="cascade-indicator" id="cascadeInfo"></div>

  <div class="reels-frame">
    <div class="reels-container" id="reelsContainer"></div>
  </div>

  <div class="fs-indicator" id="fsStatus">
    🎁 FREE SPINS — Remaining: <span id="fsRemain">0</span>
  </div>

  <div class="win-bar" id="winBar"></div>

  <button class="toggle-bet" onclick="toggleBetPanel()">⚙️ Bet Settings</button>
  <div class="bet-panel" id="betPanel">
    <div class="bet-header">
      <span>Bet Options</span>
      <span style="color:var(--gold); cursor:pointer;" onclick="toggleBetPanel()">✕</span>
    </div>
    <div class="bet-row"><span>Total Bet</span><span class="bet-val" id="panelBet">₱1.00</span></div>
    <div class="bet-row"><span>Bonus Buy (75×)</span><span class="bet-val" id="buyCost">₱75.00</span></div>
    <div class="bet-controls">
      <button class="btn btn-brown" onclick="changeBet(-1)">−</button>
      <button class="btn btn-brown" onclick="setMaxBet()">Max</button>
      <button class="btn btn-green" onclick="buyFeature()">🎁 Buy FS</button>
      <button class="btn btn-brown" onclick="changeBet(+1)">+</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-col"><div class="status-label">BALANCE</div><div class="status-val" id="balance">1000.00</div></div>
    <div class="status-col"><div class="status-label">BET</div><div class="status-val" id="betDisplay">1.00</div></div>
    <div class="status-col"><div class="status-label">FREE SPINS</div><div class="status-val" id="fsCount">0</div></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 SPIN</button>

</div>

<script>
// ==============================================
// 🔊 SOUNDS
// ==============================================
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, dur, type='sine', vol=0.3) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.frequency.value = freq; o.type = type;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, AC.currentTime+dur);
  o.start(AC.currentTime); o.stop(AC.currentTime+dur);
}
function spinSound() { tone(200,.1,'tri',.2); setTimeout(()=>tone(300,.08),80); setTimeout(()=>tone(400,.08),160); }
function cascadeSound() { tone(440,.1,'sine',.2); setTimeout(()=>tone(523,.1),100); }
function winSound() { [523,659,784,1047].map((f,i)=>setTimeout(()=>tone(f,.25,'sine',.3),i*100)); }
function scatterSound() { [523,659,784,1047,1319].map((f,i)=>setTimeout(()=>tone(f,.3,'sine',.4),i*90)); }
function bigWinSound() { [392,494,587,784,988,1175,1319].map((f,i)=>setTimeout(()=>tone(f,.35,'sine',.4),i*70)); }

// ==============================================
// 🎰 SYMBOLS
// ==============================================
const SYMBOLS = [
  { id: 'A', disp: 'A', payout: {3:1,4:2,5:5,6:10}, weight: 15 },
  { id: 'K', disp: 'K', payout: {3:1,4:2,5:5,6:10}, weight: 15 },
  { id: 'Q', disp: 'Q', payout: {3:1,4:2,5:3,6:5}, weight: 15 },
  { id: 'J', disp: 'J', payout: {3:1,4:2,5:3,6:5}, weight: 15 },
  { id: '10', disp: '10', payout: {3:1,4:2,5:3,6:5}, weight: 12 },
  { id: 'boots', disp: '🥾', payout: {3:2,4:5,5:10,6:15}, weight: 10 },
  { id: 'whiskey', disp: '🥃', payout: {3:2,4:5,5:10,6:20}, weight: 9 },
  { id: 'hat', disp: '🤠', payout: {3:5,4:10,5:20,6:30}, weight: 8 },
  { id: 'gun', disp: '🔫', payout: {3:5,4:10,5:20,6:30}, weight: 7 },
  { id: 'bandit', disp: '🎭', payout: {3:10,4:20,5:50,6:50}, weight: 5 },
  { id: 'WILD', disp: '💎', payout: null, isWild: true, weight: 3 },
  { id: 'SCATTER', disp: '🏜️', payout: null, isScatter: true, weight: 2 }
];

let weightedPool = [];
SYMBOLS.forEach(sym => { for(let i=0; i<sym.weight; i++) weightedPool.push(sym); });
const REEL_ROWS = [3,4,5,5,4,3];
const SYM_HEIGHT = 50;
const BET_LEVELS = [1, 2, 5, 10, 25, 50, 100, 200, 500, 1000, 2000, 5000];

// ==============================================
// 🎮 GAME CORE
// ==============================================
const game = {
  balance: 1000.00,
  betIndex: 0,
  freeSpins: 0,
  isSpinning: false,
  isCascading: false,
  currentMultiplier: 1,
  fsMultiplierStart: 8,
  reelData: [],
  totalWin: 0,

  get totalBet() { return BET_LEVELS[this.betIndex]; },
  get buyCost() { return this.totalBet * 75; },

  init() {
    this.load();
    this.buildReels();
    this.updateUI();
  },

  buildReels() {
    const c = document.getElementById('reelsContainer');
    c.innerHTML = '';
    this.reelData = [];

    for (let r=0; r<6; r++) {
      const rows = REEL_ROWS[r];
      const reel = document.createElement('div');
      reel.className = `reel r${r+1}`;
      
      const viewport = document.createElement('div');
      viewport.className = 'reel-viewport';
      
      const strip = document.createElement('div');
      strip.className = 'reel-strip';
      strip.id = `strip-${r}`;
      
      this.reelData[r] = [];
      // ✅ Dagdag na simbolo sa itaas para sa tunay na pagbagsak
      for (let i=0; i<rows + 4; i++) {
        const sym = this.randSym();
        const isGold = (r===2 || r===3) && !sym.isScatter && !sym.isWild && Math.random() < 0.3;
        const sEl = document.createElement('div');
        sEl.className = 'symbol'
          + (sym.isScatter ? ' scatter' : '')
          + (sym.isWild ? ' wild' : '')
          + (isGold ? ' gold-frame' : '');
        sEl.textContent = sym.disp;
        sEl.id = `sym-${r}-${i}`;
        strip.appendChild(sEl);
        this.reelData[r].push({ ...sym, goldFrame: isGold });
      }
      
      viewport.appendChild(strip);
      reel.appendChild(viewport);
      c.appendChild(reel);
    }
  },

  randSym() { return weightedPool[Math.floor(Math.random() * weightedPool.length)]; },

  async spin() {
    if (this.isSpinning || this.isCascading) return;
    
    const usingFS = this.freeSpins > 0;
    if (!usingFS) {
      if (this.balance < this.totalBet) { alert('Insufficient balance!'); return; }
      this.balance -= this.totalBet;
      this.currentMultiplier = 1;
    } else {
      this.freeSpins--;
      this.currentMultiplier = this.fsMultiplierStart;
    }
    
    this.isSpinning = true;
    this.totalWin = 0;
    document.getElementById('winBar').textContent = '';
    document.getElementById('winBar').classList.remove('mega');
    document.getElementById('cascadeInfo').textContent = '';
    
    // ✅ TUNAY NA PAG-IKOT MULA ITAAS PABABA
    spinSound();
    for (let r=0; r<6; r++) {
      const strip = document.getElementById(`strip-${r}`);
      const rows = REEL_ROWS[r];
      const scrollAmount = (Math.floor(Math.random() * 4) + 6) * SYM_HEIGHT;
      
      strip.classList.remove('spinning', 'cascading');
      strip.style.transition = 'none';
      strip.style.transform = `translateY(-${scrollAmount}px)`;
      void strip.offsetHeight;
      
      strip.classList.add('spinning');
      strip.style.transition = `transform ${1.0 + r * 0.15}s cubic-bezier(0.17, 0.67, 0.45, 1)`;
      strip.style.transform = 'translateY(0)';
      
      // I-refresh ang nakikitang simbolo pagkatapos huminto
      setTimeout(() => this.refreshVisibleSymbols(r), 1000 + r * 150);
    }
    
    await new Promise(res => setTimeout(res, 1800));
    this.isSpinning = false;
    
    // Simulan ang cascade check
    await this.runCascades(usingFS);
  },

  refreshVisibleSymbols(reelIdx) {
    const rows = REEL_ROWS[reelIdx];
    for (let i=0; i<rows; i++) {
      const sym = this.randSym();
      const isGold = (reelIdx===2 || reelIdx===3) && !sym.isScatter && !sym.isWild && Math.random() < 0.3;
      const el = document.getElementById(`sym-${reelIdx}-${i}`);
      el.textContent = sym.disp;
      el.className = 'symbol'
        + (sym.isScatter ? ' scatter' : '')
        + (sym.isWild ? ' wild' : '')
        + (isGold ? ' gold-frame' : '');
      this.reelData[reelIdx][i] = { ...sym, goldFrame: isGold };
    }
  },

  async runCascades(isFS) {
    let cascadeCount = 0;
    let hasWin = true;
    
    while (hasWin && !this.isSpinning) {
      const result = this.checkWins();
      hasWin = result.hasWin;
      
      if (!hasWin) break;
      
      cascadeCount++;
      cascadeSound();
      document.getElementById('cascadeInfo').textContent = `Cascade ${cascadeCount} — ×${this.currentMultiplier}`;
      
      // ✅ PAGTANGGAL NG PANALO → PAGBAGSAK NG BAGONG SIMBOLO
      await this.removeAndFall(result.winPositions);
      
      this.totalWin += result.payout;
      this.currentMultiplier = Math.min(this.currentMultiplier * 2, 1024);
      
      // Gawing Wild ang Gold Frame na kasama sa panalo
      this.transformGoldToWild(result.winPositions);
      
      this.updateMultiplierUI();
      await new Promise(res => setTimeout(res, 600));
    }
    
    // Check Scatters
    const scatters = this.countScatters();
    if (scatters >= 3) {
      scatterSound();
      const award = [0,0,0,10,12,14,15][scatters];
      this.freeSpins += award;
      setTimeout(() => alert(`🏜️ ${scatters} SCATTER!\n+${award} FREE SPINS!\nStarts at ×8!`), 400);
    }
    
    // Ipakita ang kabuuan
    if (this.totalWin > 0) {
      const final = this.totalWin * this.currentMultiplier;
      this.balance += final;
      if (this.currentMultiplier >= 128) {
        document.getElementById('winBar').classList.add('mega');
        bigWinSound();
      } else winSound();
      document.getElementById('winBar').innerHTML = `🎉 WIN: ₱${final.toFixed(2)} @ ×${this.currentMultiplier}`
        + (this.currentMultiplier >= 1024 ? '<br>🔥 MAX ×1024!' : '');
    }
    
    this.updateUI();
    
    // Auto FS spin
    if (this.freeSpins > 0) {
      setTimeout(() => { if (!this.isSpinning) this.spin(); }, 1000);
    }
  },

  checkWins() {
    let payout = 0;
    let hasWin = false;
    const positions = [];
    
    for (let row=0; row<5; row++) {
      let len = 0; let ref = null;
      for (let r=0; r<6; r++) {
        if (row >= REEL_ROWS[r]) break;
        const sym = this.reelData[r][row];
        if (sym.isWild) { len++; continue; }
        if (!ref) { ref = sym; len++; }
        else if (sym.id === ref.id || sym.isWild) len++;
        else break;
      }
      if (len >= 3 && ref && ref.payout) {
        const mult = ref.payout[len];
        payout += (this.totalBet / 10) * mult;
        hasWin = true;
        for (let r=0; r<len; r++) positions.push([r, row]);
      }
    }
    return { hasWin, payout, winPositions: positions };
  },

  async removeAndFall(positions) {
    // Mark for removal
    positions.forEach(([r, row]) => {
      const el = document.getElementById(`sym-${r}-${row}`);
      if (el) el.classList.add('removing');
    });
    await new Promise(res => setTimeout(res, 400));
    
    // ✅ TUNAY NA PAGBAGSAK — Ang mga nasa itaas ay bumababa
    for (let r=0; r<6; r++) {
      const rows = REEL_ROWS[r];
      const winRows = [...new Set(positions.filter(p=>p[0]===r).map(p=>p[1]))].sort((a,b)=>a-b);
      
      if (winRows.length === 0) continue;
      
      // Ilipat pababa ang mga simbolong hindi natanggal
      let newState = [...this.reelData[r]];
      
      // Mula sa ibaba pataas — punan ang mga walang laman ng bago mula itaas
      let empty = 0;
      for (let i = rows - 1; i >= 0; i--) {
        if (winRows.includes(i)) {
          empty++;
          // Maglagay ng bagong simbolo na bumababa mula itaas
          const newSym = this.randSym();
          const isGold = (r===2 || r===3) && !newSym.isScatter && !newSym.isWild && Math.random() < 0.3;
          newState[i] = { ...newSym, goldFrame: isGold };
        } else if (empty > 0) {
          newState[i + empty] = newState[i];
          const newSym = this.randSym();
          const isGold = (r===2 || r===3) && !newSym.isScatter && !newSym.isWild && Math.random() < 0.3;
          newState[i] = { ...newSym, goldFrame: isGold };
        }
      }
      
      this.reelData[r] = newState;
      
      // Ipakita na may pagbagsak
      for (let i=0; i<rows; i++) {
        const el = document.getElementById(`sym-${r}-${i}`);
        const s = this.reelData[r][i];
        el.classList.remove('removing', 'win-highlight');
        el.textContent = s.disp;
        el.className = 'symbol'
          + (s.isScatter ? ' scatter' : '')
          + (s.isWild ? ' wild' : '')
          + (s.goldFrame ? ' gold-frame' : '')
          + (empty > 0 ? ' falling' : '');
      }
    }
  },

  transformGoldToWild(positions) {
    positions.forEach(([r, row]) => {
      if ((r === 2 || r === 3) && row < this.reelData[r].length) {
        const s = this.reelData[r][row];
        if (s.goldFrame && !s.isWild && !s.isScatter) {
          s.isWild = true; s.goldFrame = false;
          const el = document.getElementById(`sym-${r}-${row}`);
          el.textContent = '💎';
          el.classList.remove('gold-frame');
          el.classList.add('wild');
        }
      }
    });
  },

  countScatters() {
    let c = 0;
    for (let r=0; r<6; r++)
      for (let i=0; i<REEL_ROWS[r]; i++)
        if (this.reelData[r][i]?.isScatter) c++;
    return c;
  },

  updateMultiplierUI() {
    document.querySelectorAll('.mult-step').forEach(el => {
      const m = parseInt(el.dataset.m);
      el.classList.remove('active','maxed');
      if (m <= this.currentMultiplier) {
        el.classList.add('active');
        if (m === 1024) el.classList.add('maxed');
      }
    });
  },

  updateUI() {
    document.getElementById('balance').textContent = this.balance.toFixed(2);
    document.getElementById('betDisplay').textContent = this.totalBet.toFixed(2);
    document.getElementById('fsCount').textContent = this.freeSpins;
    document.getElementById('fsRemain').textContent = this.freeSpins;
    document.getElementById('panelBet').textContent = '₱' + this.totalBet.toFixed(2);
    document.getElementById('buyCost').textContent = '₱' + this.buyCost.toFixed(2);
    document.getElementById('fsStatus').style.display = this.freeSpins > 0 ? 'block' : 'none';
    
    const btn = document.getElementById('spinBtn');
    btn.disabled = this.isSpinning || (this.balance < this.totalBet && this.freeSpins === 0);
    if (this.freeSpins > 0) {
      btn.textContent = `🎰 FS ×${this.currentMultiplier} (${this.freeSpins})`;
      btn.classList.add('fs-mode');
    } else {
      btn.textContent = '🎰 SPIN';
      btn.classList.remove('fs-mode');
    }
    this.save();
  },

  save() {
    localStorage.setItem('wb_bal', this.balance);
    localStorage.setItem('wb_bet', this.betIndex);
    localStorage.setItem('wb_fs', this.freeSpins);
  },
  load() {
    this.balance = parseFloat(localStorage.getItem('wb_bal')) || 1000;
    this.betIndex = parseInt(localStorage.getItem('wb_bet')) || 0;
    this.freeSpins = parseInt(localStorage.getItem('wb_fs')) || 0;
  }
};

function spin() { game.spin(); }
function changeBet(d) {
  if (game.isSpinning || game.freeSpins > 0) { alert('Finish FS first!'); return; }
  const i = game.betIndex + d;
  if (i >= 0 && i < BET_LEVELS.length) { game.betIndex = i; game.updateUI(); }
}
function setMaxBet() {
  if (game.isSpinning || game.freeSpins > 0) { alert('Finish FS first!'); return; }
  game.betIndex = BET_LEVELS.length - 1; game.updateUI();
}
function buyFeature() {
  if (game.freeSpins > 0 || game.isSpinning) { alert('In progress!'); return; }
  if (game.balance < game.buyCost) { alert(`Need ₱${game.buyCost.toFixed(2)}`); return; }
  game.balance -= game.buyCost; game.freeSpins += 10;
  alert('🎁 10 FREE SPINS! Start ×8!');
  toggleBetPanel(); game.updateUI();
}
function toggleBetPanel() {
  const p = document.getElementById('betPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

game.init();
</script>
</body>
</html>
