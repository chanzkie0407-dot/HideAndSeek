<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 WILD BOUNTY CLONE — Progressive Multiplier</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
  :root {
    --gold: #FFD700;
    --goldDark: #B8860B;
    --red: #E53935;
    --green: #2ECC71;
    --bgMain: linear-gradient(180deg, #1A0B2E 0%, #0F0719 100%);
    --reelBg: linear-gradient(180deg, #2D1B4E 0%, #1E1035 100%);
    --symbolBg: #160A2B;
    --btnSpin: linear-gradient(180deg, #FFD700 0%, #E6B800 100%);
    --btnGreen: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
  }
  body {
    background: var(--bgMain);
    min-height: 100vh;
    color: white;
    padding: 15px;
    text-align: center;
  }
  .container { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; color: var(--gold); margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .subtitle { font-size: 12px; opacity: 0.6; margin-bottom: 15px; }

  /* === STATUS BAR === */
  .status-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 15px;
  }
  .stat { text-align: center; flex: 1; }
  .stat-label { font-size: 11px; opacity: 0.6; }
  .stat-val { font-size: 18px; font-weight: bold; }

  /* === MULTIPLIER DISPLAY === */
  .mult-box {
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 15px;
  }
  .mult-label { font-size: 12px; opacity: 0.7; margin-bottom: 5px; }
  .mult-val {
    font-size: 36px;
    font-weight: bold;
    color: var(--gold);
    text-shadow: 0 0 15px gold;
    transition: all 0.3s;
  }
  .mult-val.growing { animation: pop 0.5s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .mult-chain {
    display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .mult-chain span {
    background: #2A1447; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 14px;
  }
  .mult-chain span.active {
    background: var(--gold); color: #000; box-shadow: 0 0 10px gold;
  }
  .fs-badge {
    display: inline-block; background: var(--green); padding: 6px 14px; border-radius: 20px;
    font-weight: bold; margin-left: 10px; font-size: 13px;
  }

  /* === SLOT FRAME === */
  .slot-frame {
    background: linear-gradient(180deg, #8B4513 0%, #5D2E0C 100%);
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(255,215,0,0.25), inset 0 0 20px rgba(0,0,0,0.5);
    margin-bottom: 15px;
  }
  .reels-container {
    display: flex; gap: 6px; background: var(--reelBg); padding: 10px; border-radius: 10px;
  }
  .reel {
    flex: 1; height: 140px; background: var(--symbolBg); border-radius: 6px;
    overflow: hidden; position: relative; border: 2px solid #4A2A7A;
  }
  .reel-inner {
    position: absolute; width: 100%;
    transition: transform cubic-bezier(0.17, 0.67, 0.83, 0.99);
  }
  .symbol {
    height: 46px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; border-bottom: 1px solid #3A1A63;
  }
  .symbol.wild {
    background: linear-gradient(90deg, #2A1447, #4A2A7A, #2A1447);
    color: gold; font-size: 26px;
  }
  .symbol.wild span { animation: glow 1s infinite alternate; }
  @keyframes glow {
    from { filter: drop-shadow(0 0 5px gold); }
    to { filter: drop-shadow(0 0 15px gold); }
  }
  .symbol.match { animation: pulse 0.5s alternate 3; background: rgba(46,204,113,0.25); }
  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }

  /* === CONTROLS === */
  .controls { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-spin { background: var(--btnSpin); color: #2A1447; font-size: 20px; }
  .btn-freespin { background: var(--btnGreen); color: white; }

  /* === WIN DISPLAY === */
  .win-display {
    font-size: 20px; font-weight: bold; color: var(--gold);
    margin-top: 10px; min-height: 30px; text-shadow: 0 0 8px gold;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🔥 WILD BOUNTY SHOWDOWN — STYLE</h1>
  <p class="subtitle">A • K • Q • J • 💎 Wild — Progressive Multiplier</p>

  <!-- STATUS -->
  <div class="status-bar">
    <div class="stat">
      <div class="stat-label">💰 BALANCE</div>
      <div class="stat-val" id="balanceVal">1000</div>
    </div>
    <div class="stat">
      <div class="stat-label">🎁 FREE SPINS</div>
      <div class="stat-val" id="fsVal">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">💲 BET</div>
      <div class="stat-val" id="betVal">10</div>
    </div>
  </div>

  <!-- MULTIPLIER -->
  <div class="mult-box">
    <div class="mult-label">🔥 PROGRESSIVE MULTIPLIER — Streak: <span id="streakCount">0</span></div>
    <div class="mult-val" id="multDisplay">×1</div>
    <div class="mult-chain" id="multChain">
      <span class="active">×1</span>
      <span>×2</span>
      <span>×4</span>
      <span>×8</span>
      <span>×16</span>
      <span>×32</span>
    </div>
    <span class="fs-badge" id="fsBadge" style="display:none;">🎁 FREE SPINS ACTIVE!</span>
  </div>

  <!-- SLOT FRAME -->
  <div class="slot-frame">
    <div class="reels-container" id="reelsContainer"></div>
    <div class="win-display" id="winDisplay"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-spin" id="spinBtn" onclick="spinReels()">🎰 SPIN</button>
    <button class="btn btn-freespin" id="fsBtn" onclick="useFreeSpin()" style="display:none;">🎁 FREE SPIN</button>
  </div>
</div>

<script>
// ==============================================
// 🔊 SOUNDS
// ==============================================
const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur, type='sine', vol=0.3) {
  const osc = AudioCtx.createOscillator();
  const gain = AudioCtx.createGain();
  osc.connect(gain); gain.connect(AudioCtx.destination);
  osc.frequency.value = freq; osc.type = type;
  gain.gain.setValueAtTime(vol, AudioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, AudioCtx.currentTime + dur);
  osc.start(AudioCtx.currentTime); osc.stop(AudioCtx.currentTime + dur);
}
function playSpin() { playTone(220,0.1,'triangle',0.2); setTimeout(()=>playTone(330,0.08),100); setTimeout(()=>playTone(440,0.08),200); }
function playWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.3),i*120)); }
function playBigWin() { [440,554,659,880,1047,1319].forEach((f,i)=>setTimeout(()=>playTone(f,0.35,'sine',0.4),i*100)); }
function playFreeSpin() { [440,554,659,880].forEach((f,i)=>setTimeout(()=>playTone(f,0.4,'sine',0.4),i*150)); }

// ==============================================
// 🎰 GAME SYSTEM
// ==============================================
const game = {
  balance: 1000,
  bet: 10,
  freeSpins: 0,
  streak: 0, // consecutive wins
  isSpinning: false,
  reelCount: 5,
  symbolsPerReel: 3,

  // ✨ MULTIPLIER: ×1, ×2, ×4, ×8, ×16, ×32 — DOUBLE EVERY WIN
  get multiplier() {
    return Math.pow(2, Math.min(this.streak, 5));
  },

  symbols: [
    { id: 'A', display: 'A', payout: 15 },
    { id: 'K', display: 'K', payout: 12 },
    { id: 'Q', display: 'Q', payout: 10 },
    { id: 'J', display: 'J', payout: 8 },
    { id: '10', display: '10', payout: 6 },
    { id: '9', display: '9', payout: 5 },
    { id: 'WILD', display: '💎', payout: 0, isWild: true }
  ],

  init() {
    this.load();
    this.buildReels();
    this.updateUI();
  },

  buildReels() {
    const container = document.getElementById('reelsContainer');
    container.innerHTML = '';
    for (let r=0; r<this.reelCount; r++) {
      const reel = document.createElement('div');
      reel.className = 'reel'; reel.id = `reel-${r}`;
      const inner = document.createElement('div');
      inner.className = 'reel-inner'; inner.id = `reelInner-${r}`;
      for (let i=0; i<this.symbolsPerReel + 6; i++) {
        const sym = document.createElement('div');
        sym.className = 'symbol'; sym.id = `sym-${r}-${i}`;
        inner.appendChild(sym);
      }
      reel.appendChild(inner);
      container.appendChild(reel);
    }
  },

  getRandomSymbol() {
    return this.symbols[Math.floor(Math.random() * this.symbols.length)];
  },

  spin(duration=2000) {
    if (this.isSpinning) return Promise.resolve(false);
    if (this.freeSpins <= 0) {
      if (this.balance < this.bet) {
        alert('Not enough balance!');
        return Promise.resolve(false);
      }
      this.balance -= this.bet;
    } else {
      this.freeSpins--;
    }
    this.isSpinning = true;
    playSpin();
    document.getElementById('winDisplay').textContent = '';

    const finalSymbols = [];
    for (let r=0; r<this.reelCount; r++) {
      finalSymbols[r] = [];
      const stopRow = Math.floor(Math.random() * 4) + 2;
      for (let i=0; i<this.symbolsPerReel; i++) {
        const sym = this.getRandomSymbol();
        finalSymbols[r].push(sym);
        const el = document.getElementById(`sym-${r}-${i}`);
        el.innerHTML = sym.isWild ? `<span>${sym.display}</span>` : sym.display;
        el.className = 'symbol' + (sym.isWild ? ' wild' : '');
      }
      const inner = document.getElementById(`reelInner-${r}`);
      inner.style.transition = `transform ${1.2 + r*0.25}s cubic-bezier(0.17, 0.67, 0.83, 0.99) ${r*0.3}s`;
      inner.style.transform = `translateY(-${stopRow * 46}px)`;
    }

    return new Promise(res => {
      setTimeout(() => {
        this.isSpinning = false;
        this.checkMatches(finalSymbols);
        res(finalSymbols);
      }, duration);
    });
  },

  checkMatches(syms) {
    const middleRow = [];
    let wildCount = 0;
    for (let r=0; r<this.reelCount; r++) {
      middleRow.push(syms[r][1]);
      if (syms[r][1].isWild) wildCount++;
    }

    // 💎 3+ Wild = Free Spins
    if (wildCount >= 3) {
      const bonus = wildCount === 3 ? 5 : wildCount === 4 ? 10 : 20;
      this.freeSpins += bonus;
      playFreeSpin();
      setTimeout(() => alert(`💎 ${wildCount} WILD = +${bonus} FREE SPINS!`), 500);
    }

    // Check matches — Wild substitutes any
    let mainSymbol = null;
    let matchLen = 0;
    let firstNonWild = null;

    for (let r=0; r<this.reelCount; r++) {
      const cur = middleRow[r];
      if (!cur.isWild) {
        if (!firstNonWild) {
          firstNonWild = cur;
          matchLen++;
        } else if (cur.id === firstNonWild.id || mainSymbol?.id === cur.id) {
          matchLen++;
        } else break;
      } else {
        matchLen++; // Wild always matches
      }
      if (!mainSymbol && !cur.isWild) mainSymbol = cur;
    }

    if (matchLen >= 3) {
      // ✅ WIN — STREAK CONTINUES → MULTIPLIER DOUBLES!
      this.streak++;
      const mult = this.multiplier;
      const sym = mainSymbol || firstNonWild || { display: '💎', payout: 20 };
      const baseWin = sym.payout * this.bet;
      const totalWin = baseWin * mult;

      this.balance += totalWin;
      if (mult >= 8) playBigWin(); else playWin();

      // Highlight winning symbols
      for (let i=0; i<matchLen; i++) {
        document.getElementById(`sym-${i}-1`).classList.add('match');
      }

      document.getElementById('winDisplay').innerHTML = 
        `🎉 ${matchLen}x ${sym.display} ×${mult} = +${totalWin}!`;
      
      this.updateMultiplierDisplay();
    } else {
      // ❌ NO MATCH — RESET TO ×1
      this.streak = 0;
      this.updateMultiplierDisplay();
    }

    this.updateUI();
  },

  updateMultiplierDisplay() {
    const display = document.getElementById('multDisplay');
    display.textContent = `×${this.multiplier}`;
    display.classList.remove('growing');
    void display.offsetWidth;
    display.classList.add('growing');
    document.getElementById('streakCount').textContent = this.streak;

    const steps = document.querySelectorAll('#multChain span');
    steps.forEach((step, idx) => {
      step.className = idx <= this.streak ? 'active' : '';
    });
  },

  updateUI() {
    document.getElementById('balanceVal').textContent = this.balance;
    document.getElementById('fsVal').textContent = this.freeSpins;
    document.getElementById('fsBtn').style.display = this.freeSpins > 0 ? 'inline-block' : 'none';
    document.getElementById('fsBadge').style.display = this.freeSpins > 0 ? 'inline-block' : 'none';
    document.getElementById('spinBtn').disabled = this.isSpinning;
    this.save();
  },

  save() {
    localStorage.setItem('wbBalance', this.balance);
    localStorage.setItem('wbFS', this.freeSpins);
    localStorage.setItem('wbStreak', this.streak);
  },
  load() {
    this.balance = parseInt(localStorage.getItem('wbBalance')) || 1000;
    this.freeSpins = parseInt(localStorage.getItem('wbFS')) || 0;
    this.streak = parseInt(localStorage.getItem('wbStreak')) || 0;
    this.updateMultiplierDisplay();
  }
};

// ==============================================
// 🎯 GLOBAL FUNCTIONS
// ==============================================
async function spinReels() {
  if (game.isSpinning) return;
  document.getElementById('spinBtn').disabled = true;
  // Reset reels
  for (let r=0; r<game.reelCount; r++) {
    const inner = document.getElementById(`reelInner-${r}`);
    inner.style.transition = 'none';
    inner.style.transform = 'translateY(0)';
  }
  await new Promise(r => setTimeout(r, 50));
  await game.spin(2000);
  game.updateUI();
}

async function useFreeSpin() {
  if (game.freeSpins <= 0 || game.isSpinning) return;
  await spinReels();
}

// START
game.init();
</script>
</body>
</html>
